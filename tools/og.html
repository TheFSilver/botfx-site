<script>const x=document.getElementById('c').getContext('2d'),N=1600,g=Math.PI*(3-Math.sqrt(5)),R=210,cx=900,cy=315,a=.5,b=.35;

x.strokeStyle='rgba(255,255,255,.08)';x.beginPath();x.ellipse(cx,cy,R*1.45,R*.42,-.35,0,7);x.stroke();</script></body></html>
