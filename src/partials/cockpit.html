<aside class="cockpit" aria-label="Démonstration du pilote automatique">
  <div class="niche-row">
    <label for="niche-hero" class="mono">Votre activité</label>
    <select id="niche-hero" data-niche-select><option value="">Choisir</option></select>
  </div>
  <div class="cockpit-head">
    <button type="button" class="switch" role="switch" aria-checked="true" data-autopilot><span class="switch-track" aria-hidden="true"><i></i></span><span>Pilote automatique</span></button>
    <span class="pill mono">Démo</span>
  </div>
  <ul class="ticker" data-ticker>
    <li><span class="tick" aria-hidden="true"></span>Facture relancée</li>
    <li><span class="tick" aria-hidden="true"></span>Devis signé, dossier créé</li>
    <li><span class="tick" aria-hidden="true"></span>Pièce manquante réclamée</li>
    <li><span class="tick" aria-hidden="true"></span>Rapport du lundi envoyé</li>
  </ul>
  <p class="cockpit-foot mono" data-backlog>0 tâche en attente</p>
</aside>
