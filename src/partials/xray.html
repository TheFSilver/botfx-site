<section class="sec" data-xray data-play aria-labelledby="xray-title">

    <div class="sec-head">
      <div data-reveal>
        <p class="kicker mono">Radiographie</p>
        <h2 id="xray-title">Cette page, <span class="silver">mesurée en direct.</span></h2>
      </div>
      <p data-reveal style="--d:.1s">Ces chiffres sont lus maintenant, dans votre navigateur. Comparez avec le site de votre choix.</p>
    </div>
    <dl class="xray-grid">
      <div class="xray-cell"><dt class="mono">Poids transféré</dt><dd data-xray-weight>…</dd></div>

      <div class="xray-cell"><dt class="mono">Domaines tiers</dt><dd data-xray-third>…</dd></div>
      <div class="xray-cell"><dt class="mono">Cookies</dt><dd data-xray-cookies>…</dd></div>
      <div class="xray-cell"><dt class="mono">Balises de la page</dt><dd data-xray-nodes>…</dd></div>
    </dl>
    <div class="cta-row xray-actions"><button type="button" class="btn" data-xray-toggle aria-pressed="false">Voir la structure de la page</button></div>
  </div>
</section>
